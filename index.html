<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muse's Bloom</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="bloom.css" />
    <link rel="icon" type="image/x-icon" href="/images/morning-glory.png">
  </head>
  <body>
    <header class="page-header py-4">
      <div class="container">
        <h1 class="fw-bold my-2">Muse's</h1>
        <h1 class="fw-bold my-2" style="color: #7a9bc4;">Bloom</h1>
        <p class="text-muted" >For a more colorful world</p>
      </div>
    </header>

    <main class="container py-5">

        <!--indicators-->
      <section class="row g-3 mb-5">
        <div class="col-6 col-md-3">
          <div class="stat-card">
            <p class="text-muted mb-1">Customers</p>

            <h2 id="totalCustomers">0</h2>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="stat-card">
            <p class="text-muted mb-1">Products</p>

            <h2 id="totalProducts">0</h2>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="stat-card">
            <p class="text-muted mb-1">Orders</p>

            <h2 id="totalOrders">0</h2>
          </div>
        </div>

        <div class="col-6 col-md-3">
          <div class="stat-card">
            <p class="text-muted mb-1">Total Amount</p>

            <h2 id="totalAmount">0 DH</h2>
          </div>
        </div>
      </section>

      <!--search-->
      <section>
        <label for="searchInput" class="form-label fw-semibold">Search by customer name</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Salwa">
      </section>
    

      <!--filtre-->
      <section>
        <!--categories-->
        <p class="fw-semibold mb-2">Categories</p>
        <div class="d-flex flex-wrap gap-2 mb-3" id="categoryButtons"></div>

        <!--checkbox-->
        <div class="form-check">
            <input type="checkbox" id="AvailableOnly" class="form-check-input">
            <label for="AvailableOnly" class="form-check-label">Show Only Available Bouquets</label>
        </div>
      </section>

      <!--counter-->
      <p id="resultCount" class="text-muted">Waiting...</p>

      <!--erreur-->
      <div class="alert alert-danger d-none" id="errorMes"> There's been a problem, check the pathway of Json files please.
      </div>

      <section class="table-responsive">
        <table class="table align-middle bg-white">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Bouquet</th>
                    <th>Occasion</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th></th>
                </tr>
            </thead>

            <tbody id="itemsTableBody"></tbody>
        </table>
      </section>

    </main>

    <!--modal-->
    <div class="modal fade" id="detailModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-4"><span id="detailName"></span></h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <img id="detailImage" alt="" class="detail-img mb-3">

                    <p><strong>Occasion: </strong> <span id="detailCategory"></span></p>
                    <p><strong>Price: </strong> <span id="detailPrice"></span></p>
                    <p><strong>Stock: </strong> <span id="detailStock"></span></p>
                    <p><strong>Flowers: </strong> <span id="detailFlowers"></span></p>
                    <p class="text-muted" id="detailDescription"></p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Close
                    </button>
                </div>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
